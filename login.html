<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="UTF-8">
    <title>Log in</title>
</head>
<body>
    <h1>Log in</h1>

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p}}

        <input type="hidden" name="next" value="{{next}}">

        <button type="submit">Log in</button>
    </form>

    <p><a href="{% url 'polls:index' %}">Back to polls</a></p>
</body>
</html>
